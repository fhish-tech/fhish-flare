[package]
name = "fhish-wasm"
version = "1.5.4"
edition = "2021"
authors = ["FHISH Protocol"]
description = "FHISH WASM bindings for TFHE-rs with full server-side FHE operations"
license = "BSD-3-Clause-Clear"
repository = "https://github.com/fhish/fhish"
categories = ["cryptography", "wasm"]
keywords = ["fhe", "tfhe", "homomorphic", "encryption", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "shortint-keygen"
path = "src/bin/shortint_keygen.rs"

[[bin]]
name = "fhe-keygen"
path = "src/bin/fhe_keygen.rs"

[dependencies]
wasm-bindgen = { version = "0.2.100", features = ["serde-serialize"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
paste = "1.0"
chrono = "0.4"

tfhe = { path = "../../_references/zama/tfhe-rs/tfhe", default-features = false, features = [
    "boolean",
    "shortint",
    "integer",
    "zk-pok",
    "extended-types",
    "software-prng",
    "shortint-client-js-wasm-api",
] }

# Workspace dependencies for tfhe submodules
tfhe-fft = { path = "../../_references/zama/tfhe-rs/tfhe-fft" }
tfhe-csprng = { path = "../../_references/zama/tfhe-rs/tfhe-csprng" }
tfhe-ntt = { path = "../../_references/zama/tfhe-rs/tfhe-ntt" }
tfhe-zk-pok = { path = "../../_references/zama/tfhe-rs/tfhe-zk-pok" }
tfhe-versionable = { path = "../../_references/zama/tfhe-rs/utils/tfhe-versionable" }
tfhe-safe-serialize = { path = "../../_references/zama/tfhe-rs/utils/tfhe-safe-serialize" }

rayon = "1.8"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
